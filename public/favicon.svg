<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#000000"/>
  <!-- Arc / Arch mark — peak at y≈160, endpoints at y=230 -->
  <path d="M 80 230 Q 256 90 432 230" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
  <!-- KEMETRISE — baseline y=305 -->
  <text x="256" y="305" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="400" fill="#ffffff" text-anchor="middle" letter-spacing="12">KEMETRISE</text>
  <!-- LEGACY NEXUS — baseline y=348 -->
  <text x="256" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" fill="#ffffff" text-anchor="middle" letter-spacing="10">LEGACY NEXUS</text>
</svg>
